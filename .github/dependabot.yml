version: 2
updates:
  # Keep SHA-pinned GitHub Actions current — Dependabot bumps the pin (and its
  # # vX.Y.Z comment) when a new release ships, so pinning stays immutable
  # without going stale on security patches.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
