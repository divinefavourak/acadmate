name: Deploy Backend

# Auto-deploys the NestJS API to the HackClub Nest server on every push to master
# that touches the backend, plus manual runs. The image is built on GitHub's
# runners and pushed to GHCR; the server only pulls it. Frontend deploys separately (Vercel),
# so this is path-filtered to backend files only.
on:
  push:
    branches: [master]
    paths:
      - 'acadmate-api/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-flight deploy (it may be mid prisma db push / container swap).
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: acadmate-api
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: acadmate-api/package-lock.json

      # `npm install` (not `npm ci`) to match the Dockerfile — the Windows-generated
      # lockfile omits Linux-only optional deps and breaks `npm ci` on the runner.
      - name: Install, generate client, build
        run: npm install    # postinstall runs `prisma generate && nest build` (type-check)

      # lint/test omitted: eslint and jest aren't installed in acadmate-api yet.

  # Build here, never on the server: it has 2 GB of RAM shared with a dozen other
  # containers, and building there has run it out of memory before.
  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/acadmate-api
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./acadmate-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=0
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY DEPLOY_PATH; do
            if [ -z "${!v}" ]; then echo "::error::Missing required secret: $v"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          # tr -d '\r' guards against CRLF if the key was pasted from Windows.
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${SSH_PORT:-22}"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            # Preferred: pinned, pre-verified host key — no trust-on-first-use window.
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Fallback: TOFU. ssh-keyscan trusts whatever key the host presents on
            # THIS run, so a MITM during the scan would be trusted. Acceptable only
            # for initial setup / low-risk use — set the SSH_KNOWN_HOSTS secret to
            # close this gap. Don't swallow keyscan failures — a bad host must fail.
            echo "::warning::SSH_KNOWN_HOSTS not set — using ssh-keyscan (trust-on-first-use). Set SSH_KNOWN_HOSTS to pin the host key."
            ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          # The remote work succeeds but ssh returns 255 on this host during
          # connection teardown after `docker compose up -d` (the remote shell
          # exits 0 and we receive all output, but the channel close is reported
          # as an ssh transport error). So we don't trust ssh's exit code: the
          # remote prints __DEPLOY_OK__ only if every command ran (`set -e` aborts
          # before the marker on any real failure), and we assert on that.
          # Deterministic update (reset, not pull); pull ONLY the api image, which
          # the image job just pushed, so db + redis stay up. Nothing is built here; schema is applied at boot via prisma db push
          # (Dockerfile CMD), so there is no separate migrate step.
          out="$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "set -e; cd $DEPLOY_PATH \
              && git fetch origin master \
              && git reset --hard origin/master \
              && docker compose -f docker-compose.prod.yml pull api \
              && docker compose -f docker-compose.prod.yml up -d api \
              && docker compose -f docker-compose.prod.yml ps \
              && echo __DEPLOY_OK__" 2>&1)" || true
          printf '%s\n' "$out"
          if ! printf '%s\n' "$out" | grep -q '__DEPLOY_OK__'; then
            echo "::error::Deploy did not reach the success marker — remote command failed (see output above)."
            exit 1
          fi
          echo "Deploy verified: __DEPLOY_OK__ received."
